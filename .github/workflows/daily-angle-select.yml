name: Daily 25-Angle Selection & Diploman Times Queue

on:
  push:
    paths:
      - "data/*-matches.json"
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch:
    inputs:
      run_date_utc:
        description: "Optional UTC date override (YYYY-MM-DD); defaults to today UTC"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  football-angle-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve UTC run date
        id: run_meta
        run: |
          RUN_DATE="${{ github.event.inputs.run_date_utc }}"
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE=$(date -u +%F)
          fi
          echo "run_date_utc=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: 1. Extract Football Tally metrics summary
        run: >
          node scripts/extract_football_summary.js
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --data-dir "data"
          --out "state/footballtally/daily_metrics_summary.json"

      - name: 2. Validate Football Tally metrics
        run: >
          node scripts/validate_inputs.js
          --vertical "footballtally"
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --metrics "state/footballtally/daily_metrics_summary.json"

      - name: 3. Select daily headline angle (25-Angle Matrix)
        run: >
          node scripts/select_angle.js
          --vertical "footballtally"
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --angles "config/angles-25-master.json"
          --metrics "state/footballtally/daily_metrics_summary.json"
          --history "state/footballtally/angle_history.json"
          --out "state/footballtally/latest_selection.json"

      - name: 4. Queue scored brief for Diploman Times (news-queue.json)
        run: >
          node scripts/queue_scored_brief.js
          --vertical "footballtally"
          --selection "state/footballtally/latest_selection.json"
          --metrics "state/footballtally/daily_metrics_summary.json"
          --queue "news-queue.json"

      - name: Commit updated football state, card & news-queue.json
        run: |
          RUN_DATE="${{ steps.run_meta.outputs.run_date_utc }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "state/footballtally/daily_metrics_summary.json" \
            "state/footballtally/angle_history.json" \
            "state/footballtally/latest_selection.json" \
            "news-queue.json"
          if [ -d "assets/cards" ]; then
            git add "assets/cards"
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(footballtally): extract, select angle & queue Diploman Times brief for ${RUN_DATE}"
            git push
          fi
